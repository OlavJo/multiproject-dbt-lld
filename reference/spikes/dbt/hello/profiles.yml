# dbt Projects on Snowflake: account and user are taken from the session and
# are not used, but dbt-snowflake requires the keys to be present.
hello:
  target: spike
  outputs:
    spike:
      type: snowflake
      account: not_needed
      user: not_needed
      role: SILVER_STEWARD
      warehouse: SPIKE_WH
      database: SPIKE_LAB
      schema: HELLO
      threads: 1
