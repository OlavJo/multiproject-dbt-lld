version: 2

sources:
  # Live raw tables: read only by the freeze and by freshness observation (SLD 6.3)
  - name: erp_raw
    database: raw
    schema: erp
    config:
      loaded_at_query: |
        select max(completed_at)
        from {{ var('ops_database') }}.control.v_landing_complete
        where source_system = 'ERP'
    tables:
      - name: accounts
      - name: orders

  # Frozen inputs: what every model and source test reads (SLD 7). Declared in the published
  # schema; source() redirects them to the schema being built (macros/relation_overrides.sql).
  - name: erp_frozen
    database: silver
    schema: erp
    tables:
      - name: accounts
        identifier: raw__accounts
        columns:
          - name: account_id
            data_tests: [not_null, unique]
      - name: orders
        identifier: raw__orders
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: _seq
            data_tests: [not_null]
